<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>wtweaks</Name>
    <Username>wtweaks</Username>
    <Title>wtweaks</Title>
    <ShortDescription>tweaks without going overboard</ShortDescription>
    <Description>Hand-picked Windows tweaks from Atlas OS and ReviOS without going overboard: Explorer and Start menu QoL, debloat, privacy and system hardening, plus Atlas wallpapers with dark mode. Optional Firefox/Chrome install. No revert, use on a fresh install.</Description>
    <Details>The best tweaks, without going overboard</Details>
    <Version>0.1.0</Version>
    <UniqueId>73628f32-b1de-4192-9af5-4b4748245745</UniqueId>
    <SupportedBuilds>
        <!-- Windows 10 22H2 only -->
        <string>19045</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>Internet</Requirement>
    </Requirements>
    <FeaturePages>
        <RadioPage IsRequired="true" DefaultOption="defender-enable" Description="Disabling Defender reduces security, and is an option for advanced users only. Turn off Tamper Protection beforehand or it will not apply.">
            <TopLine Text="Defender can be re-enabled by choosing the other option on re-run."/>
            <Options>
                <RadioOption>
                    <Text>Enable Defender (recommended)</Text>
                    <Name>defender-enable</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Disable Defender</Text>
                    <Name>defender-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage IsRequired="true" Description="Select the options you would like to use.">
            <Options>
                <CheckboxOption>
                    <Text>Install a Browser</Text>
                    <Name>install-another-browser</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <RadioImagePage CheckDefaultBrowser="true" DependsOn="install-another-browser" DefaultOption="browser-firefox" Description="Select your preferred browser to install. Browser settings are not modified.">
            <Options>
                <RadioImageOption>
                    <Text>Firefox</Text>
                    <Name>browser-firefox</Name>
                    <FileName>firefox</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Chrome</Text>
                    <Name>browser-chrome</Name>
                    <FileName>chrome</FileName>
                    <GradientTopColor>#7E7E7E</GradientTopColor>
                    <GradientBottomColor>#D0D0D0</GradientBottomColor>
                </RadioImageOption>
            </Options>
        </RadioImagePage>
    </FeaturePages>
</Playbook>
