---
title: Configure Taskbar Pins
description: Replaces taskbar pins with Explorer + browser, drops dead pins (Atlas OS)
actions:
  - !taskKill: {name: 'explorer'}

  # Ensure the key exists, then set pins metadata (Atlas OS)
  - !registryKey:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    operation: add
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    value: 'FavoritesVersion'
    data: '3'
    type: REG_DWORD
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband\AuxilliaryPins'
    value: 'MailPin'
    data: '0'
    type: REG_DWORD
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Taskband\AuxilliaryPins'
    value: 'CopilotPWAPin'
    data: '0'
    type: REG_DWORD

  # Set new pins (browser must already be installed, hence the order in main.yml)
  - !powerShell:
    command: '.\Set-TaskbarPins.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: ".\\Set-TaskbarPins.ps1 'Firefox'"
    option: 'browser-firefox'
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: ".\\Set-TaskbarPins.ps1 'Google Chrome'"
    option: 'browser-chrome'
    exeDir: true
    wait: true
    runas: currentUserElevated

  - !run: {exe: 'explorer.exe', runas: 'currentUser', wait: false}
